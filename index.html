<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magical Mirai 2026 — Lyric App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Yu Gothic','Hiragino Kana','Noto Sans JP',sans-serif;background:#06001a;color:#fff;overflow:hidden;width:100vw;height:100vh;transition:background 2s ease;}
#canvas-bg{position:fixed;inset:0;z-index:0;}
#mood-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;transition:background 3s ease;}
#bflash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .05s;}

/* Loading */
#loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.2s ease;}
#loading.out{opacity:0;pointer-events:none;}
.ld-ring{width:56px;height:56px;border:2px solid rgba(255,255,255,.15);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-t1{font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.5);}
.ld-t2{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.25);}

/* Header */
#hdr{position:fixed;top:0;left:0;right:0;z-index:20;padding:14px 22px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);}
.hdr-l{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.35);text-transform:uppercase;}
.hdr-r{text-align:right;}
.hdr-song{font-size:14px;font-weight:700;letter-spacing:1px;transition:color .5s;}
.hdr-artist{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}

/* Credit */
#credit-badge{position:fixed;top:58px;right:14px;z-index:25;background:rgba(0,0,0,.4);border-radius:8px;padding:6px 10px;backdrop-filter:blur(10px);text-align:right;line-height:1.6;border:1px solid rgba(255,255,255,.1);transition:border-color .5s;}
.cr-title{font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;transition:color .5s;}
.cr-line{font-size:8px;color:rgba(255,255,255,.5);}
.cr-line a{color:rgba(180,180,255,.6);text-decoration:none;}
.cr-line strong{color:rgba(255,255,255,.75);}
.cr-license{font-size:7.5px;color:rgba(255,255,255,.28);margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.08);}
#section-lbl{position:fixed;top:152px;right:14px;z-index:20;font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.2);text-transform:uppercase;}

/* Tabs */
#song-tabs{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:21;display:flex;}
.stab{padding:8px 18px;font-size:10px;letter-spacing:1px;cursor:pointer;border:none;background:rgba(0,0,0,.4);color:rgba(255,255,255,.35);transition:all .3s;backdrop-filter:blur(8px);border-bottom:2px solid transparent;}
.stab:first-child{border-radius:0 0 0 8px;}
.stab:last-child{border-radius:0 0 8px 0;}
.stab.active{color:#fff;font-weight:700;}

/* Miku */
#miku-wrap{position:fixed;right:0;bottom:100px;z-index:15;width:clamp(200px,25vw,360px);pointer-events:none;}
#miku-img{width:100%;height:auto;display:block;object-fit:contain;object-position:bottom;animation:mikuFloat 4.5s ease-in-out infinite;transition:opacity .5s,filter 1s;}
@keyframes mikuFloat{0%,100%{transform:translateY(0);}40%{transform:translateY(-16px);}70%{transform:translateY(-8px);}}
#miku-wrap.beat #miku-img{animation:mikuBeat .2s ease forwards;}
@keyframes mikuBeat{0%{transform:scale(1)translateY(0);}50%{transform:scale(1.05)translateY(-10px);}100%{transform:scale(1)translateY(0);}}
#miku-aura{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:110%;height:50%;animation:auraBreath 3.5s ease-in-out infinite;z-index:-1;transition:background 1s;}
@keyframes auraBreath{0%,100%{opacity:.6;}50%{opacity:1;}}

/* Lyrics */
#lyric-stage{position:fixed;top:0;bottom:110px;left:0;right:clamp(205px,26vw,370px);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:85px 30px 20px;text-align:center;}
#lyric-prev{font-size:clamp(11px,1.3vw,14px);color:rgba(255,255,255,.22);letter-spacing:3px;min-height:22px;transition:all .5s;margin-bottom:16px;}
#lyric-main{font-size:clamp(20px,3vw,38px);font-weight:900;letter-spacing:5px;line-height:1.6;min-height:65px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;max-width:100%;}
.w{display:inline-block;color:rgba(255,255,255,.28);transition:color .07s,text-shadow .07s,transform .08s;}
.w.active{transform:scale(1.1)translateY(-2px);}
.w.sung{color:rgba(255,255,255,.65);text-shadow:none;transform:scale(1);}
#lyric-next{font-size:clamp(11px,1.3vw,14px);color:rgba(255,255,255,.16);letter-spacing:3px;min-height:22px;margin-top:16px;transition:all .5s;}

/* Petals */
#petals{position:fixed;inset:0;z-index:2;pointer-events:none;}
.petal{position:absolute;opacity:0;animation:pfall linear infinite;border-radius:50% 10% 50% 10%;}
@keyframes pfall{0%{transform:translateY(-10px)rotate(0deg);opacity:0;}10%{opacity:.55;}90%{opacity:.25;}100%{transform:translateY(102vh)rotate(600deg);opacity:0;}}
#particles{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.ptcl{position:absolute;border-radius:50%;pointer-events:none;animation:ptclRise linear forwards;}
@keyframes ptclRise{0%{opacity:0;transform:translateY(0)scale(0);}20%{opacity:.8;transform:translateY(-30px)scale(1);}100%{opacity:0;transform:translateY(-130px)scale(.2);}}

/* Viz */
#viz{position:fixed;bottom:65px;left:0;right:clamp(205px,26vw,370px);display:flex;justify-content:center;align-items:flex-end;gap:2px;height:28px;z-index:12;}
.vb{width:3px;border-radius:2px;min-height:2px;transition:height .08s ease;}

/* Progress */
#prog-wrap{position:fixed;bottom:48px;left:2%;right:2%;z-index:12;}
#prog-bg{width:100%;height:2px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;cursor:pointer;}
#prog-fill{height:100%;width:0%;border-radius:4px;box-shadow:0 0 8px rgba(255,255,255,.3);transition:width .25s linear,background .5s;}
#time-row{margin-top:5px;font-size:10px;color:rgba(255,255,255,.25);display:flex;justify-content:space-between;}

/* Controls */
#ctrls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:12;display:flex;gap:10px;align-items:center;}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;padding:7px 20px;border-radius:40px;cursor:pointer;font-size:11px;letter-spacing:1px;backdrop-filter:blur(8px);transition:all .2s;}
.btn:hover{background:rgba(255,255,255,.18);}
.btn.main{border-color:transparent;font-weight:700;}
.btn.main:hover{filter:brightness(1.2);}
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div id="mood-overlay"></div>
<div id="bflash"></div>
<div id="petals"></div>
<div id="particles"></div>

<div id="loading">
  <div class="ld-ring" id="ld-ring"></div>
  <div class="ld-t1">MAGICAL MIRAI 2026</div>
  <div class="ld-t2" id="ld-sub">Loading...</div>
</div>

<div id="song-tabs">
  <button class="stab active" onclick="switchSong(0)">こたえて</button>
  <button class="stab" onclick="switchSong(1)">Song 2</button>
  <button class="stab" onclick="switchSong(2)">Song 3</button>
</div>

<div id="hdr">
  <div class="hdr-l">Magical Mirai 2026 · Programming Contest</div>
  <div class="hdr-r">
    <div class="hdr-song" id="hdr-song">こたえて</div>
    <div class="hdr-artist" id="hdr-artist">imie feat. 初音ミク</div>
  </div>
</div>

<div id="credit-badge">
  <div class="cr-title" id="cr-title">Artwork Credit</div>
  <div class="cr-line"><strong>初音ミク / Hatsune Miku</strong></div>
  <div class="cr-line">Illust: <strong id="cr-artist">wata</strong> — <a href="https://piapro.net" target="_blank">piapro.net</a></div>
  <div class="cr-line">© <a href="https://piapro.net/intl/en_for_creators.html" target="_blank">Crypton Future Media, INC.</a> 2007</div>
  <div class="cr-license">CC BY-NC 3.0 Unported · piapro.net/license</div>
</div>
<div id="section-lbl">INTRO</div>

<div id="miku-wrap">
  <div id="miku-aura"></div>
  <img id="miku-img" src="./miku1.png" alt="Hatsune Miku © Crypton Future Media INC. 2007 CC BY-NC 3.0" onerror="this.style.opacity='0'"/>
</div>

<div id="lyric-stage">
  <div id="lyric-prev"></div>
  <div id="lyric-main"><span style="color:rgba(255,255,255,.12);font-size:16px;letter-spacing:6px">♪</span></div>
  <div id="lyric-next"></div>
</div>

<div id="viz"></div>

<div id="prog-wrap">
  <div id="prog-bg" onclick="seekTo(event)"><div id="prog-fill"></div></div>
  <div id="time-row"><span id="tc">0:00</span><span id="tt">0:00</span></div>
</div>

<div id="ctrls">
  <button class="btn main" id="pbtn" onclick="onPlay()">▶ PLAY</button>
  <button class="btn" id="pausebtn" onclick="onPause()">⏸ PAUSE</button>
  <button class="btn" onclick="onStop()">⏹ STOP</button>
</div>

<script>
// ── SONG CONFIG ──────────────────────────────────────────────────────
const SONGS = [
  {
    title:'こたえて', artist:'imie feat. 初音ミク',
    url:'https://piapro.jp/t/6W2N/20240202030017',
    vOpts:{beatId:4592,chordId:2727,repetitiveSegmentId:2146},
    art:'./miku1.png', illust:'wata',
    T:{
      bg:'#0a0018',tabBg:'linear-gradient(135deg,#d4a0ff,#ffe8a0)',tabFg:'#1a0030',
      btn:'linear-gradient(135deg,#9c4dff,#ffd04d)',btnSh:'rgba(200,140,255,.5)',
      acc:'#ffe566',aw:'#ffe566',wg:'0 0 16px #ffe566,0 0 36px rgba(255,210,50,.5)',
      pf:'linear-gradient(to right,#c678ff,#ffe566)',
      petal:['#fce4ec','#fff9c4','#e1f5fe','#f8bbd0','#fffde7'],
      ptcl:['#ffe566','#ff80ab','#b388ff','#fff9c4','#80deea'],
      viz:'linear-gradient(to top,#c678ff,#ffe566)',
      mood:{
        intro:'radial-gradient(ellipse at 30% 100%,rgba(180,120,255,.22) 0%,transparent 55%),radial-gradient(ellipse at 70% 0%,rgba(255,200,100,.12) 0%,transparent 55%)',
        verse:'radial-gradient(ellipse at 20% 80%,rgba(255,180,220,.18) 0%,transparent 55%)',
        preC:'radial-gradient(ellipse at 50% 60%,rgba(255,220,120,.14) 0%,transparent 55%)',
        chorus:'radial-gradient(ellipse at 50% 40%,rgba(255,180,80,.25) 0%,transparent 60%),radial-gradient(ellipse at 25% 80%,rgba(180,100,255,.22) 0%,transparent 55%)',
        verse2:'radial-gradient(ellipse at 70% 70%,rgba(255,160,200,.15) 0%,transparent 55%)',
        finalC:'radial-gradient(ellipse at 50% 35%,rgba(255,230,80,.28) 0%,transparent 60%)',
        outro:'radial-gradient(ellipse at 50% 50%,rgba(180,120,255,.12) 0%,transparent 60%)',
      },
      mglow:'drop-shadow(0 0 40px rgba(255,220,100,.4)) drop-shadow(0 20px 60px rgba(180,100,255,.3))',
      aura:'radial-gradient(ellipse at 50% 90%,rgba(255,200,100,.25) 0%,transparent 65%)',
      flash:'radial-gradient(ellipse at center,rgba(255,229,127,.1) 0%,transparent 65%)',
      crCol:'#ffd04d',crBd:'rgba(255,200,80,.25)',
    }
  },
  {
    title:'Song 2', artist:'feat. 初音ミク',
    url:'', vOpts:{}, art:'./miku2.png', illust:'Tiv',
    T:{
      bg:'#000a1f',tabBg:'linear-gradient(135deg,#4488ff,#00ddb8)',tabFg:'#000a1f',
      btn:'linear-gradient(135deg,#1a4fff,#00ddb8)',btnSh:'rgba(0,180,200,.5)',
      acc:'#00ddb8',aw:'#7af5ff',wg:'0 0 16px #7af5ff,0 0 36px rgba(0,220,240,.5)',
      pf:'linear-gradient(to right,#1a4fff,#00ddb8)',
      petal:['#b2ebf2','#80deea','#e0f7fa','#b3e5fc','#dcedc8'],
      ptcl:['#00ddb8','#7af5ff','#4488ff','#80deea','#b2ebf2'],
      viz:'linear-gradient(to top,#1a4fff,#00ddb8)',
      mood:{
        intro:'radial-gradient(ellipse at 30% 100%,rgba(0,100,200,.3) 0%,transparent 55%)',
        verse:'radial-gradient(ellipse at 20% 80%,rgba(0,180,200,.2) 0%,transparent 55%)',
        preC:'radial-gradient(ellipse at 50% 60%,rgba(0,200,220,.15) 0%,transparent 55%)',
        chorus:'radial-gradient(ellipse at 50% 40%,rgba(0,220,200,.28) 0%,transparent 60%),radial-gradient(ellipse at 25% 80%,rgba(0,100,255,.25) 0%,transparent 55%)',
        verse2:'radial-gradient(ellipse at 70% 70%,rgba(0,160,200,.18) 0%,transparent 55%)',
        finalC:'radial-gradient(ellipse at 50% 35%,rgba(0,240,220,.3) 0%,transparent 60%)',
        outro:'radial-gradient(ellipse at 50% 50%,rgba(0,100,200,.15) 0%,transparent 60%)',
      },
      mglow:'drop-shadow(0 0 40px rgba(0,220,200,.5)) drop-shadow(0 20px 60px rgba(0,100,255,.3))',
      aura:'radial-gradient(ellipse at 50% 90%,rgba(0,220,200,.3) 0%,transparent 65%)',
      flash:'radial-gradient(ellipse at center,rgba(0,220,200,.1) 0%,transparent 65%)',
      crCol:'#00ddb8',crBd:'rgba(0,220,200,.25)',
    }
  },
  {
    title:'Song 3', artist:'feat. 初音ミク',
    url:'', vOpts:{}, art:'./miku3.png', illust:'tama',
    T:{
      bg:'#001a18',tabBg:'linear-gradient(135deg,#00ddb8,#ffb347)',tabFg:'#001a18',
      btn:'linear-gradient(135deg,#00b894,#ffb347)',btnSh:'rgba(0,200,180,.5)',
      acc:'#ffb347',aw:'#ffda79',wg:'0 0 16px #ffda79,0 0 36px rgba(255,200,80,.5)',
      pf:'linear-gradient(to right,#00ddb8,#ffb347)',
      petal:['#b2dfdb','#fff9c4','#ffe0b2','#b2ebf2','#f0f4c3'],
      ptcl:['#00ddb8','#ffb347','#ffda79','#80cbc4','#fff176'],
      viz:'linear-gradient(to top,#00b894,#ffda79)',
      mood:{
        intro:'radial-gradient(ellipse at 30% 100%,rgba(0,180,160,.25) 0%,transparent 55%)',
        verse:'radial-gradient(ellipse at 20% 80%,rgba(0,200,180,.2) 0%,transparent 55%)',
        preC:'radial-gradient(ellipse at 50% 60%,rgba(255,180,60,.15) 0%,transparent 55%)',
        chorus:'radial-gradient(ellipse at 50% 40%,rgba(255,180,60,.28) 0%,transparent 60%),radial-gradient(ellipse at 25% 80%,rgba(0,200,180,.25) 0%,transparent 55%)',
        verse2:'radial-gradient(ellipse at 70% 70%,rgba(0,180,160,.18) 0%,transparent 55%)',
        finalC:'radial-gradient(ellipse at 50% 35%,rgba(255,200,80,.3) 0%,transparent 60%)',
        outro:'radial-gradient(ellipse at 50% 50%,rgba(0,180,160,.15) 0%,transparent 60%)',
      },
      mglow:'drop-shadow(0 0 40px rgba(0,200,180,.45)) drop-shadow(0 20px 60px rgba(255,180,60,.25))',
      aura:'radial-gradient(ellipse at 50% 90%,rgba(0,200,180,.3) 0%,transparent 65%)',
      flash:'radial-gradient(ellipse at center,rgba(255,200,80,.1) 0%,transparent 65%)',
      crCol:'#00ddb8',crBd:'rgba(0,200,180,.25)',
    }
  }
];

// ── STATE ────────────────────────────────────────────────────────────
let curIdx=0, P=null, audioEl=null;
let curPhrase=null, wtoks=[], isPlaying=false, playerReady=false;
let petalCols=SONGS[0].T.petal, ptclCols=SONGS[0].T.ptcl;
const fmt=ms=>{const s=Math.floor(ms/1e3),m=Math.floor(s/60);return`${m}:${String(s%60).padStart(2,'0')}`;};

// ── THREE.JS BG ──────────────────────────────────────────────────────
const cvs=document.getElementById('canvas-bg');
const R3=new THREE.WebGLRenderer({canvas:cvs,antialias:true,alpha:true});
R3.setSize(innerWidth,innerHeight);
R3.setPixelRatio(Math.min(devicePixelRatio,2));
const SC=new THREE.Scene(),CAM=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
CAM.position.z=30;
const sg=new THREE.BufferGeometry(),sp=new Float32Array(9600);
for(let i=0;i<9600;i++)sp[i]=(Math.random()-.5)*200;
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.13,transparent:true,opacity:.55}));
SC.add(stars);
const orbs=[];
for(let i=0;i<12;i++){
  const g=new THREE.SphereGeometry(Math.random()*2+.3,16,16);
  const m=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.04+Math.random()*.07,wireframe:Math.random()>.4});
  const o=new THREE.Mesh(g,m);
  o.position.set((Math.random()-.5)*55,(Math.random()-.5)*38,(Math.random()-.5)*15-8);
  o.userData={s:Math.random()*.003+.001,p:Math.random()*Math.PI*2};
  SC.add(o);orbs.push(o);
}
let BP=0;
(function aBG(t){
  requestAnimationFrame(aBG);
  stars.rotation.y=t*.000007;stars.rotation.x=t*.000003;BP*=.9;
  orbs.forEach(o=>{
    o.rotation.x+=o.userData.s;o.rotation.y+=o.userData.s*.7;
    o.material.opacity=(.03+Math.abs(Math.sin(t*.00003+o.userData.p))*.06)*(1+BP*.25);
    o.scale.setScalar(1+BP*.12);
  });
  R3.render(SC,CAM);
})();
window.addEventListener('resize',()=>{R3.setSize(innerWidth,innerHeight);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix();});

// ── PETALS ───────────────────────────────────────────────────────────
const PC=document.getElementById('petals');
setInterval(()=>{
  const e=document.createElement('div');e.className='petal';
  const sz=Math.random()*8+3,col=petalCols[Math.floor(Math.random()*petalCols.length)];
  e.style.cssText=`width:${sz}px;height:${sz*.65}px;left:${Math.random()*100}%;background:${col};animation-duration:${7+Math.random()*8}s;animation-delay:${Math.random()*2}s;`;
  PC.appendChild(e);setTimeout(()=>e.remove(),16e3);
},480);

// ── PARTICLES ────────────────────────────────────────────────────────
const PTC=document.getElementById('particles');
function spawnPtcl(){
  for(let i=0;i<10;i++){
    const p=document.createElement('div');p.className='ptcl';
    const sz=Math.random()*5+2,col=ptclCols[Math.floor(Math.random()*ptclCols.length)];
    p.style.cssText=`width:${sz}px;height:${sz}px;left:${15+Math.random()*70}%;bottom:${80+Math.random()*220}px;background:${col};animation-duration:${.8+Math.random()*.9}s;`;
    PTC.appendChild(p);setTimeout(()=>p.remove(),1900);
  }
}

// ── VISUALIZER ───────────────────────────────────────────────────────
const VZ=document.getElementById('viz');
for(let i=0;i<38;i++){const b=document.createElement('div');b.className='vb';b.style.height='2px';VZ.appendChild(b);}
const VBS=[...VZ.querySelectorAll('.vb')];
(function aViz(){
  requestAnimationFrame(aViz);
  VBS.forEach((b,i)=>{b.style.height=(isPlaying?Math.abs(Math.sin(Date.now()*.003+i*.35))*24+2:2)+'px';});
})();

// ── BEAT ─────────────────────────────────────────────────────────────
const BFL=document.getElementById('bflash'),MW=document.getElementById('miku-wrap');
function beat(v=.4){
  BP=v;BFL.style.opacity=v*.35;setTimeout(()=>BFL.style.opacity=0,85);
  MW.classList.add('beat');setTimeout(()=>MW.classList.remove('beat'),220);
  spawnPtcl();
}

// ── MOOD ─────────────────────────────────────────────────────────────
const MO=document.getElementById('mood-overlay');
let lastR=-1;
function setMood(r){
  if(Math.abs(r-lastR)<.005)return;lastR=r;
  const T=SONGS[curIdx].T,sl=document.getElementById('section-lbl');
  let bg,lbl;
  if(r<.08){lbl='INTRO';bg=T.mood.intro;}
  else if(r<.25){lbl='VERSE';bg=T.mood.verse;}
  else if(r<.42){lbl='PRE-CHORUS';bg=T.mood.preC;}
  else if(r<.58){lbl='CHORUS';bg=T.mood.chorus;beat(.35);}
  else if(r<.75){lbl='VERSE 2';bg=T.mood.verse2;}
  else if(r<.9){lbl='FINAL CHORUS';bg=T.mood.finalC;beat(.5);}
  else{lbl='OUTRO';bg=T.mood.outro;}
  sl.textContent=lbl;MO.style.background=bg;
}

// ── LYRICS ───────────────────────────────────────────────────────────
function renderPhrase(ph){
  const el=document.getElementById('lyric-main');el.innerHTML='';wtoks=[];
  if(!ph)return;
  let w=ph.firstWord;
  while(w){const sp=document.createElement('span');sp.className='w';sp.textContent=w.text;el.appendChild(sp);wtoks.push({el:sp,s:w.startTime,e:w.endTime});w=w.next;}
}
function karaoke(pos){
  const T=SONGS[curIdx].T;
  wtoks.forEach(t=>{
    if(pos>=t.e){t.el.classList.remove('active');t.el.classList.add('sung');t.el.style.color='';t.el.style.textShadow='';}
    else if(pos>=t.s){t.el.classList.add('active');t.el.classList.remove('sung');t.el.style.color=T.aw;t.el.style.textShadow=T.wg;}
    else{t.el.classList.remove('active','sung');t.el.style.color='';t.el.style.textShadow='';}
  });
}

// ── THEME ────────────────────────────────────────────────────────────
function applyTheme(idx){
  const T=SONGS[idx].T,S=SONGS[idx];
  document.body.style.background=T.bg;
  document.getElementById('loading').style.background=T.bg;
  document.getElementById('ld-ring').style.borderTopColor=T.acc;
  document.querySelectorAll('.stab').forEach((t,i)=>{
    t.classList.toggle('active',i===idx);
    if(i===idx){t.style.background=T.tabBg;t.style.color=T.tabFg;t.style.borderBottomColor=T.acc;}
    else{t.style.background='rgba(0,0,0,.4)';t.style.color='rgba(255,255,255,.35)';t.style.borderBottomColor='transparent';}
  });
  document.getElementById('hdr-song').textContent=S.title;
  document.getElementById('hdr-song').style.color=T.acc;
  document.getElementById('hdr-artist').textContent=S.artist;
  document.getElementById('cr-title').style.color=T.crCol;
  document.getElementById('cr-artist').textContent=S.illust;
  document.getElementById('credit-badge').style.borderColor=T.crBd;
  const mi=document.getElementById('miku-img');
  mi.style.opacity='0';
  setTimeout(()=>{mi.src=S.art;mi.style.filter=T.mglow;mi.onload=()=>{mi.style.opacity='1';};mi.onerror=()=>{mi.style.opacity='0';};},300);
  document.getElementById('miku-aura').style.background=T.aura;
  document.getElementById('bflash').style.background=T.flash;
  document.getElementById('pbtn').style.background=T.btn;
  document.getElementById('pbtn').style.boxShadow=`0 0 14px ${T.btnSh}`;
  document.getElementById('prog-fill').style.background=T.pf;
  document.querySelectorAll('.vb').forEach(b=>b.style.background=T.viz);
  petalCols=T.petal;ptclCols=T.ptcl;
}

// ── CONTROLS ─────────────────────────────────────────────────────────
function onPlay(){
  if(P && playerReady){
    if(isPlaying) P.requestPause();
    else P.requestPlay();
  } else {
    // belum ada player atau belum ready → jalankan demo
    demo(curIdx);
  }
}
function onPause(){ if(P && playerReady && isPlaying) P.requestPause(); }
function onStop(){
  if(P && playerReady) P.requestStop();
  else { isPlaying=false; resetUI(); }
}
function seekTo(e){
  if(!P || !playerReady) return;
  const rect=e.currentTarget.getBoundingClientRect();
  const ratio=(e.clientX-rect.left)/rect.width;
  const dur=P.video?.duration||0;
  if(dur>0) P.requestMediaSeek(ratio*dur);
}

// ── RESET UI ─────────────────────────────────────────────────────────
function resetUI(){
  curPhrase=null;wtoks=[];
  document.getElementById('lyric-main').innerHTML='<span style="color:rgba(255,255,255,.12);font-size:16px;letter-spacing:6px">♪</span>';
  document.getElementById('lyric-prev').textContent='';
  document.getElementById('lyric-next').textContent='';
  document.getElementById('prog-fill').style.width='0%';
  document.getElementById('tc').textContent='0:00';
  document.getElementById('tt').textContent='0:00';
  document.getElementById('pbtn').textContent='▶ PLAY';
}

// ── TEXTALIVE PLAYER ─────────────────────────────────────────────────
function initPlayer(idx){
  if(P){try{P.dispose();}catch(e){}P=null;}
  playerReady=false; isPlaying=false;
  resetUI();

  const S=SONGS[idx];
  if(!S.url){ setTimeout(()=>demo(idx),500); return; }

  // Audio element harus ada di DOM
  if(audioEl){ try{audioEl.remove();}catch(e){} }
  audioEl=document.createElement('audio');
  audioEl.crossOrigin='anonymous';
  audioEl.style.display='none';
  document.body.appendChild(audioEl);

  try {
    P=new TextAlive.Player({
      app:{ token:'lsECENfml3yM56cS' },
      mediaElement: audioEl,
    });
  } catch(e){ console.error(e); demo(idx); return; }

  P.addListener({
    onAppReady(app){
      if(!app.managed){
        const opts=S.vOpts && S.vOpts.beatId
          ? {video:{beatId:S.vOpts.beatId,chordId:S.vOpts.chordId,repetitiveSegmentId:S.vOpts.repetitiveSegmentId}}
          : {};
        P.createFromSongUrl(S.url, opts);
      }
    },
    onVideoReady(v){
      document.getElementById('tt').textContent=fmt(v.duration||0);
    },
    onTimerReady(){
      playerReady=true;
      document.getElementById('loading').classList.add('out');
      document.getElementById('ld-sub').textContent='Ready! Click PLAY';
      document.getElementById('pbtn').textContent='▶ PLAY';
    },
    onTimeUpdate(pos){
      const dur=P.video?.duration||1;
      document.getElementById('prog-fill').style.width=(pos/dur*100)+'%';
      document.getElementById('tc').textContent=fmt(pos);
      setMood(pos/dur);
      const ph=P.video?.findPhrase(pos);
      if(ph&&ph!==curPhrase){
        document.getElementById('lyric-prev').textContent=curPhrase?.text||'';
        curPhrase=ph;renderPhrase(curPhrase);
        document.getElementById('lyric-next').textContent=ph.next?.text||'';
        beat(.4);
      }
      if(curPhrase) karaoke(pos);
    },
    onPlay(){ isPlaying=true; document.getElementById('pbtn').textContent='⏸ PAUSE'; },
    onPause(){ isPlaying=false; document.getElementById('pbtn').textContent='▶ PLAY'; },
    onStop(){ isPlaying=false; resetUI(); },
    onError(e){ console.warn('TextAlive error:',e); demo(idx); }
  });

  // Fallback 12 detik
  setTimeout(()=>{
    if(!playerReady){ console.warn('Timeout — fallback to demo'); demo(idx); }
  },12000);
}

// ── DEMO MODE ────────────────────────────────────────────────────────
const DEMO=[
  ['静かに耳を傾けて','自分を重ねて聞いてた','どれほどの苦しみも','癒しみの向こうに','ねえ、こたえて','この声が届くなら','君の温もりをもう一度だけ','こたえて','こたえて'],
  ['夜の星に願いを','蒼い光の中で','君を待ち続けた','答えを探して','遠い記憶の彼方へ','声が聞こえる'],
  ['未来へと走り出す','ミクと一緒に','Magical Mirai','夢を歌にして','こたえて'],
];
let demoTimer=null,demoProgIv=null;
function demo(idx){
  document.getElementById('loading').classList.add('out');
  isPlaying=true;
  if(demoTimer){clearTimeout(demoTimer);demoTimer=null;}
  if(demoProgIv){clearInterval(demoProgIv);demoProgIv=null;}
  const lines=DEMO[idx]||DEMO[0];
  let li=0,prog=0;
  demoProgIv=setInterval(()=>{
    if(curIdx!==idx){clearInterval(demoProgIv);return;}
    prog=(prog+.07)%100;
    document.getElementById('prog-fill').style.width=prog+'%';
    document.getElementById('tc').textContent=fmt(prog*2400);
    document.getElementById('tt').textContent='4:00';
    setMood(prog/100);
  },80);
  function nextLine(){
    if(curIdx!==idx){clearInterval(demoProgIv);return;}
    const main=document.getElementById('lyric-main');main.innerHTML='';wtoks=[];
    document.getElementById('lyric-prev').textContent=li>0?lines[(li-1)%lines.length]:'';
    document.getElementById('lyric-next').textContent=lines[(li+1)%lines.length]||'';
    const line=lines[li%lines.length];
    [...line].forEach(ch=>{const sp=document.createElement('span');sp.className='w';sp.textContent=ch;main.appendChild(sp);wtoks.push({el:sp});});
    beat(.45);li++;
    let ci=0;const T=SONGS[idx].T;
    const iv=setInterval(()=>{
      if(curIdx!==idx){clearInterval(iv);return;}
      if(ci>0&&wtoks[ci-1]){wtoks[ci-1].el.classList.remove('active');wtoks[ci-1].el.classList.add('sung');wtoks[ci-1].el.style.color='';wtoks[ci-1].el.style.textShadow='';}
      if(ci<wtoks.length){if(wtoks[ci]){wtoks[ci].el.classList.add('active');wtoks[ci].el.style.color=T.aw;wtoks[ci].el.style.textShadow=T.wg;}ci++;}
      else{clearInterval(iv);demoTimer=setTimeout(nextLine,1000);}
    },165);
  }
  nextLine();
}

// ── SONG SWITCH ──────────────────────────────────────────────────────
function switchSong(idx){
  if(idx===curIdx)return;
  curIdx=idx;
  applyTheme(idx);
  playerReady=false;isPlaying=false;
  if(P){try{P.dispose();}catch(e){}P=null;}
  document.getElementById('loading').classList.remove('out');
  document.getElementById('ld-sub').textContent=`Loading ${SONGS[idx].title}...`;
  setTimeout(()=>initPlayer(idx),600);
}

// ── INIT ─────────────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  applyTheme(0);
  if(typeof TextAlive==='undefined'){ demo(0); return; }
  initPlayer(0);
});
</script>
